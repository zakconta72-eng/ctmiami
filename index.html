<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CT Miami — Academia Premium em Vitória da Conquista. Treine com os melhores, resultados reais.">
    <title>CT Miami | Academia Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
        :root{
            --azul-escuro: #0F2B48;
            --azul-medio: #2A76C2;
            --azul-claro: #64B5F6;
            --azul-suave: #E3F2FD;
            --branco: #FFFFFF;
            --cinza-claro: #F5F8FC;
            --texto: #2C3E50;
            --dourado: #E5B84B;
            --sombra: rgba(42,118,194,0.15);
        }
        html{scroll-behavior:smooth}
        body{background:var(--branco);color:var(--texto);line-height:1.6;overflow-x:hidden}

        /* 🔹 Barra de Navegação */
        nav{position:fixed;top:0;left:0;right:0;z-index:999;background:rgba(15,43,72,0.9);backdrop-filter:blur(12px);transition:all 0.4s ease}
        .nav-container{max-width:1280px;margin:0 auto;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center}
        .logo{display:flex;align-items:center;gap:0.5rem;text-decoration:none}
        .logo-icon{width:46px;height:46px;background:linear-gradient(135deg,var(--azul-claro),var(--azul-medio));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:white;font-weight:800}
        .logo-text{font-size:1.4rem;font-weight:700;color:var(--branco);letter-spacing:-0.5px}
        .logo-text span{color:var(--azul-claro)}
        .nav-links{display:flex;gap:2.5rem;list-style:none;align-items:center}
        .nav-links a{color:rgba(255,255,255,0.85);text-decoration:none;font-weight:500;font-size:0.95rem;position:relative;padding:0.5rem 0;transition:color 0.3s ease}
        .nav-links a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:var(--azul-claro);transition:width 0.3s ease}
        .nav-links a:hover{color:var(--branco)}
        .nav-links a:hover::after{width:100%}
        .btn-nav{background:linear-gradient(135deg,var(--azul-medio),var(--azul-claro));color:white;padding:0.7rem 1.6rem;border-radius:50px;font-weight:600;transition:all 0.3s ease;box-shadow:0 4px 15px rgba(100,181,246,0.3)}
        .btn-nav:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(100,181,246,0.4);color:white}
        .menu-mobile{display:none;font-size:1.8rem;color:white;cursor:pointer}

        /* 🔹 Hero Section */
        header{min-height:100vh;background:linear-gradient(135deg,var(--azul-escuro) 0%,#153A5F 50%,var(--azul-medio) 100%);display:flex;align-items:center;position:relative;overflow:hidden;padding-top:80px}
        .hero-bg-shape{position:absolute;border-radius:50%;background:rgba(100,181,246,0.08);filter:blur(60px);animation:float 8s ease-in-out infinite}
        .shape-1{width:500px;height:500px;top:-150px;right:-100px}
        .shape-2{width:400px;height:400px;bottom:-100px;left:-100px;animation-delay:-4s}
        @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
        
        .hero-container{max-width:1280px;margin:0 auto;padding:2rem;display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center;position:relative;z-index:1}
        .hero-badge{display:inline-flex;align-items:center;gap:0.6rem;background:rgba(100,181,246,0.15);border:1px solid rgba(100,181,246,0.3);padding:0.6rem 1.2rem;border-radius:50px;color:var(--azul-claro);font-size:0.85rem;font-weight:500;margin-bottom:1.5rem;animation:fadeInUp 0.8s ease both}
        .hero h1{font-size:clamp(2.8rem,5vw,4.5rem);line-height:1.1;color:white;margin-bottom:1.5rem;animation:fadeInUp 0.8s ease 0.1s both}
        .hero h1 span{background:linear-gradient(90deg,var(--azul-claro),#B3E5FC);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .hero p{font-size:1.15rem;color:rgba(255,255,255,0.75);margin-bottom:2.5rem;max-width:500px;line-height:1.8;animation:fadeInUp 0.8s ease 0.2s both}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        
        .hero-buttons{display:flex;gap:1.2rem;flex-wrap:wrap;animation:fadeInUp 0.8s ease 0.3s both}
        .btn-primary{background:linear-gradient(135deg,var(--azul-claro),var(--azul-medio));color:white;padding:1rem 2.2rem;border-radius:50px;font-weight:600;text-decoration:none;box-shadow:0 8px 25px rgba(100,181,246,0.35);transition:all 0.4s ease;display:inline-flex;align-items:center;gap:0.6rem}
        .btn-primary:hover{transform:translateY(-4px);box-shadow:0 12px 35px rgba(100,181,246,0.45)}
        .btn-secondary{border:2px solid rgba(255,255,255,0.3);color:white;padding:1rem 2.2rem;border-radius:50px;font-weight:600;text-decoration:none;transition:all 0.4s ease;display:inline-flex;align-items:center;gap:0.6rem}
        .btn-secondary:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.5)}
        
        .hero-stats{display:flex;gap:3rem;margin-top:4rem;animation:fadeInUp 0.8s ease 0.4s both}
        .stat-item h3{font-size:2.5rem;color:white;font-weight:700}
        .stat-item p{color:rgba(255,255,255,0.5);font-size:0.9rem;margin:0}

        .hero-image{position:relative;animation:fadeIn 1s ease 0.5s both}
        @keyframes fadeIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
        .img-frame{width:100%;aspect-ratio:4/5;background:linear-gradient(135deg,var(--azul-claro),var(--azul-medio));border-radius:24px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:6rem;color:white}
        .img-deco{position:absolute;background:rgba(255,255,255,0.05);border-radius:16px}
        .deco-1{width:120px;height:120px;top:-20px;right:-20px}
        .deco-2{width:80px;height:80px;bottom:30px;left:-20px;background:var(--azul-claro);opacity:0.2}

        /* 🔹 Seções Gerais */
        section{padding:6rem 2rem;max-width:1280px;margin:0 auto}
        .section-header{text-align:center;margin-bottom:4rem}
        .section-label{color:var(--azul-medio);font-weight:600;font-size:0.9rem;text-transform:uppercase;letter-spacing:2px;margin-bottom:0.8rem}
        .section-title{font-size:clamp(1.8rem,3vw,2.8rem);color:var(--azul-escuro);margin-bottom:1rem}
        .section-subtitle{color:#64748B;max-width:600px;margin:0 auto}

        /* 🔹 Sobre Nós */
        .sobre-wrapper{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
        .sobre-card{background:var(--cinza-claro);border-radius:24px;padding:2.5rem;position:relative;overflow:hidden}
        .sobre-card::before{content:'';position:absolute;top:0;left:0;width:6px;height:100%;background:linear-gradient(180deg,var(--azul-claro),var(--azul-medio));border-radius:6px}
        .sobre-card h3{font-size:1.5rem;color:var(--azul-escuro);margin-bottom:1.2rem}
        .sobre-card p{color:#55687C;margin-bottom:1rem}
        .diferenciais{display:grid;gap:1.2rem;margin-top:2rem}
        .dif-item{display:flex;align-items:flex-start;gap:1rem}
        .dif-icon{width:42px;height:42px;background:var(--azul-suave);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--azul-medio);font-size:1.2rem;flex-shrink:0}
        .dif-text h4{font-size:1rem;color:var(--azul-escuro);margin-bottom:0.25rem}
        .dif-text p{font-size:0.88rem;color:#64748B;margin:0}

        /* 🔹 Serviços */
        .servicos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:2rem}
        .servico-card{background:white;border-radius:20px;padding:2.5rem;box-shadow:0 4px 20px var(--sombra);border:1px solid rgba(42,118,194,0.08);transition:all 0.4s ease;position:relative;overflow:hidden;z-index:1}
        .servico-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--azul-claro),var(--azul-medio));transform:scaleX(0);transform-origin:left;transition:transform 0.4s ease;z-index:-1}
        .servico-card:hover{transform:translateY(-8px);box-shadow:0 12px 35px rgba(42,118,194,0.15)}
        .servico-card:hover::before{transform:scaleX(1)}
        .serv-icon{width:60px;height:60px;background:var(--azul-suave);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:var(--azul-medio);margin-bottom:1.5rem}
        .servico-card h3{font-size:1.25rem;color:var(--azul-escuro);margin-bottom:1rem}
        .servico-card p{color:#64748B;line-height:1.7;margin-bottom:1.2rem}
        .servico-card a{color:var(--azul-medio);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:0.4rem;transition:gap 0.3s ease}
        .servico-card a:hover{gap:0.7rem}

        /* 🔹 Planos */
        .planos-section{background:linear-gradient(180deg,var(--cinza-claro),white);margin:0;padding:6rem 2rem}
        .planos-container{max-width:1280px;margin:0 auto}
        .planos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2rem;margin-top:3rem}
        .plano-card{background:white;border-radius:20px;padding:2.5rem;box-shadow:0 4px 20px var(--sombra);border:2px solid transparent;transition:all 0.4s ease;position:relative}
        .plano-card.destaque{border-color:var(--azul-medio);transform:scale(1.03);box-shadow:0 10px 35px rgba(42,118,194,0.18)}
        .plano-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,var(--azul-medio),var(--azul-claro));color:white;font-size:0.75rem;font-weight:600;padding:0.4rem 1.2rem;border-radius:50px}
        .plano-card h3{font-size:1.3rem;color:var(--azul-escuro);margin-bottom:0.5rem}
        .plano-preco{font-size:2.5rem;font-weight:800;color:var(--azul-medio);margin-bottom:1.5rem}
        .plano-preco span{font-size:0.9rem;font-weight:400;color:#888}
        .plano-itens{list-style:none;margin-bottom:2rem}
        .plano-itens li{padding:0.6rem 0;border-bottom:1px solid #F0F4F8;color:#55687C;font-size:0.95rem}
        .plano-itens li:last-child{border:none}
        .btn-plano{display:block;text-align:center;background:var(--azul-suave);color:var(--azul-medio);padding:0.9rem;border-radius:12px;font-weight:600;text-decoration:none;transition:all 0.3s ease}
        .plano-card.destaque .btn-plano{background:linear-gradient(135deg,var(--azul-medio),var(--azul-claro));color:white}
        .btn-plano:hover{transform:translateY(-2px)}

        /* 🔹 Depoimentos */
        .depoimentos-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2rem}
        .depo-card{background:var(--cinza-claro);border-radius:20px;padding:2rem;position:relative}
        .aspas{font-size:3rem;color:var(--azul-suave);line-height:1;margin-bottom:1rem}
        .depo-texto{color:#55687C;font-style:italic;margin-bottom:1.5rem}
        .depo-perfil{display:flex;align-items:center;gap:1rem}
        .depo-foto{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--azul-claro),var(--azul-medio));display:flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:1.1rem}
        .depo-nome h4{font-size:0.95rem;color:var(--azul-escuro)}
        .depo-nome span{font-size:0.8rem;color:#888}
        .estrelas{color:var(--dourado);margin-top:0.3rem}

        /* 🔹 Contato */
        .contato-section{background:var(--azul-escuro);color:white;border-radius:24px;padding:4rem;margin:4rem auto}
        .contato-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem}
        .contato-info h3{font-size:1.8rem;margin-bottom:1.5rem;color:var(--azul-claro)}
        .contato-info p{color:rgba(255,255,255,0.7);margin-bottom:2rem}
        .contato-item{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
        .contato-icon{width:46px;height:46px;background:rgba(100,181,246,0.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
        .contato-item a{color:rgba(255,255,255,0.85);text-decoration:none;transition:color 0.3s ease}
        .contato-item a:hover{color:var(--azul-claro)}
        .redes{display:flex;gap:1rem;margin-top:2rem}
        .rede-link{width:44px;height:44px;background:rgba(255,255,255,0.05);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;text-decoration:none;transition:all 0.3s ease}
        .rede-link:hover{background:var(--azul-medio);transform:translateY(-3px)}

        /* 🔹 Footer */
        footer{background:#0A1A2F;color:rgba(255,255,255,0.6);padding:4rem 2rem 2rem;text-align:center;font-size:0.9rem}
        .footer-logo{font-size:1.5rem;font-weight:700;color:white;margin-bottom:1rem}
        .footer-logo span{color:var(--azul-claro)}
        .footer-nav{display:flex;justify-content:center;gap:2rem;margin:2rem 0;flex-wrap:wrap}
        .footer-nav a{color:rgba(255,255,255,0.5);text-decoration:none;transition:color 0.3s ease}
        .footer-nav a:hover{color:var(--azul-claro)}
        .copyright{margin-top:2rem;padding-top:2rem;border-top:1px solid rgba(255,255,255,0.05)}

        /* 🔹 Responsividade */
        @media(max-width:900px){
            .nav-links{display:none}
            .menu-mobile{display:block}
            .hero-container{grid-template-columns:1fr;text-align:center}
            .hero-buttons{justify-content:center}
            .hero-stats{justify-content:center}
            .sobre-wrapper,.contato-grid{grid-template-columns:1fr}
        }
        @media(max-width:600px){
            .hero-stats{flex-direction:column;gap:1rem;align-items:center}
            .planos-grid{gap:2rem}
        }
    </style>
</head>
<body>

<!-- 🔹 Navegação -->
<nav id="navbar">
    <div class="nav-container">
        <a href="#" class="logo">
            <div class="logo-icon">CT</div>
            <span class="logo-text">CT <span>Miami</span></span>
        </a>
        <ul class="nav-links">
            <li><a href="#inicio">Início</a></li>
            <li><a href="#sobre">Sobre</a></li>
            <li><a href="#servicos">Serviços</a></li>
            <li><a href="#planos">Planos</a></li>
            <li><a href="#depoimentos">Depoimentos</a></li>
            <li><a href="#contato" class="btn-nav">Agende uma Visita</a></li>
        </ul>
        <div class="menu-mobile">☰</div>
    </div>
</nav>

<!-- 🔹 Cabeçalho Principal -->
<header id="inicio" class="hero">
    <div class="hero-bg-shape shape-1"></div>
    <div class="hero-bg-shape shape-2"></div>
    <div class="hero-container">
        <div class="hero
